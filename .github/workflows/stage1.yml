name: Lead Automation — Stage 1 (enrich + stage)

# Extract new Leads -> enrich (LeadFeeder) -> match vs existing Accounts/Contacts ->
# write enrichment back to KN_* fields -> upload the QA artifact for human review.
# No conversion happens here (that is Stage 2, gated). The watermark is advanced and
# committed back to the repo so the next run resumes where this one stopped.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Salesforce writes)"
        type: boolean
        default: true
      limit:
        description: "LIMIT-scope the task scan (0 = unlimited)"
        type: number
        default: 0
      leadfeeder:
        description: "Use LeadFeeder enrichment (uncheck to skip credits)"
        type: boolean
        default: true
      config:
        description: "Alternate config.yaml path (blank = config/config.yaml)"
        type: string
        default: ""
  # Scheduling is EXTERNAL: cron-job.org hits this workflow's workflow_dispatch
  # (GitHub's own cron delivered these runs hours late and dropped most firings).
  # The external job POSTs {"ref":"master"} with no inputs, so runs stay dry.

# Never let two enrich runs overlap (they share the watermark file).
concurrency:
  group: lead-automation-stage1
  cancel-in-progress: false

permissions:
  contents: write   # commit the advanced watermark

jobs:
  gate:
    # Decides the effective dry-run mode. Runs are triggered by workflow_dispatch
    # (external cron-job.org schedule or a manual run), so the flag comes from
    # `inputs.dry_run`, which defaults to true. The external scheduler omits
    # inputs, so its runs stay DRY; go live by dispatching with dry_run unchecked.
    # The `if schedule` branch below is a harmless guard if a cron is ever re-added.
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.decide.outputs.dry_run }}
    steps:
      - name: Decide dry-run mode
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY="true"   # scheduled runs stay dry until go-live
          else
            DRY="${{ inputs.dry_run }}"
          fi
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"

  enrich:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      # Path of the auto-approved CSV this run produced ('' when none) — the chained
      # convert job below only fires when a live run staged live-scope rows.
      auto_csv: ${{ steps.autocsv.outputs.path }}
    env:
      # Quiet the sf CLI's background async work — a source of intermittent
      # "unsettled top-level await" / Node exit-13 hangs on CI runners.
      SF_AUTOUPDATE_DISABLE: "true"
      SF_DISABLE_TELEMETRY: "true"
      # The kununu feed is ~200 MB CSV. Keep it OUT of the checkout (the old default
      # wrote it into the working tree); common.kununu_feed reads KUNUNU_CACHE at call
      # time and sniffs CSV vs JSONL from the file CONTENT, so no format is pinned here.
      KUNUNU_CACHE: ${{ runner.temp }}/kununu/profiles.csv
      # Gate for the optional checkout below. A boolean, not the token: this only picks
      # a step, so the PAT itself never enters the environment.
      HAS_MPA: ${{ secrets.MPA_PAT != '' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check out Main-Profile-Account (optional — owns the kununu feed reader)
        # `leadauto.kununu_feed` bridges to `common.kununu_feed` in the sibling repo;
        # this project deliberately keeps NO local copy. Without it the bridge raises
        # MpaBridgeError, which is caught and degrades to no alt names, no profile_score
        # and no kununu industry — and a missing score fails the live-scope gate CLOSED,
        # so nothing converts. That was CI's silent state until 2026-08-19. The step is
        # skipped, not failed, when no PAT for the private repo is configured.
        # Sparse: `common` is stdlib-only and must never import main_profile_tag, so the
        # rest of that repo (and its data) is not fetched.
        id: mpa
        # NEVER fail the run on this: a wrong, expired or revoked PAT must
        # degrade to the no-feed state (which is how CI ran until 2026-08-19),
        # not break the scheduled pipeline. Without this a present-but-invalid
        # MPA_PAT is WORSE than an absent one - an absent secret skips the step,
        # while a bad one flips HAS_MPA true and hard-fails the checkout.
        continue-on-error: true
        if: env.HAS_MPA == 'true'
        uses: actions/checkout@v4
        with:
          repository: Nicolaus-Pichorner/Main-Profile-Account
          token: ${{ secrets.MPA_PAT }}
          path: mpa
          sparse-checkout: common
          sparse-checkout-cone-mode: true

      - name: Point the bridge at that checkout
        if: steps.mpa.outcome == 'success'
        run: echo "MPA_ROOT=${{ github.workspace }}/mpa" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Salesforce CLI
        run: |
          # Pinned for reproducibility; bump deliberately after a dry-run check.
          npm install --global @salesforce/cli@2.140.6
          sf --version

      - name: Compute feed cache key
        id: feedkey
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache kununu profile feed
        # Daily key: first run of the day restores yesterday's feed (stale), then
        # ensure_feed refreshes it and the post-job save stores it under today's key.
        # If the download fails, the stale restore keeps the gate working.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kununu
          key: kununu-feed-csv-${{ steps.feedkey.outputs.date }}
          restore-keys: kununu-feed-csv-

      - name: Authenticate to Salesforce
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}   # secret -> env, never inlined
        run: |
          # The sf CLI intermittently hangs on login (Node exit 13 / "unsettled
          # top-level await"), so retry a few times before failing the job.
          for attempt in 1 2 3; do
            printf '%s' "$SFDX_AUTH_URL" > auth.txt
            if sf org login sfdx-url --sfdx-url-file auth.txt --alias headless --set-default; then
              rm -f auth.txt
              echo "Authenticated on attempt $attempt."
              exit 0
            fi
            rm -f auth.txt
            echo "Auth attempt $attempt failed; retrying in 10s..." >&2
            sleep 10
          done
          echo "Salesforce authentication failed after 3 attempts." >&2
          exit 1

      - name: Shadow compare (score past dry-run predictions)
        continue-on-error: true   # a compare hiccup must not block enrichment
        env:
          PYTHONPATH: src
        # Self-gating to ~once a day (state/shadow_state.json, committed below): a compare
        # costs ~7-9 Salesforce requests and scores HUMAN conversions, which resolve over
        # days — running it on all 4 daily dispatches re-read the same predictions.
        run: python -m leadauto shadow-compare

      - name: Upload shadow comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-automation-shadow-${{ github.run_id }}
          path: shadow_comparison.xlsx
          if-no-files-found: ignore

      - name: Run Stage 1
        env:
          PYTHONPATH: src
          LEADFEEDER_API_KEY: ${{ secrets.LEADFEEDER_API_KEY }}
          # HTTP Basic, password-only (KUNUNU_API_USER stays unset). Deliberately NOT
          # KUNUNU_API_TOKEN: the feed does not speak Bearer and common.kununu_feed
          # refuses that name outright, so passing it authenticated nothing. The secret
          # is called KUNUNU_API_TOKEN and holds the password; it is mapped here.
          KUNUNU_API_PASSWORD: ${{ secrets.KUNUNU_API_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ needs.gate.outputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; else FLAGS="--no-dry-run"; fi
          if [ "${{ inputs.leadfeeder }}" = "false" ]; then FLAGS="$FLAGS --no-leadfeeder"; fi
          LIMIT="${{ inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" -gt 0 ] 2>/dev/null; then FLAGS="$FLAGS --limit $LIMIT"; fi
          if [ -n "${{ inputs.config }}" ]; then FLAGS="$FLAGS --config ${{ inputs.config }}"; fi
          echo "Running: python -m leadauto stage1 $FLAGS"
          python -m leadauto stage1 $FLAGS --qa-path qa_artifact.xlsx

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-automation-qa-${{ github.run_id }}
          path: qa_artifact.xlsx
          if-no-files-found: warn

      - name: Detect auto-approved CSV from this run
        id: autocsv
        # A fresh auto CSV is the only untracked review/*_auto.csv (previous ones are
        # committed). Its path feeds the chained Stage-2 convert job.
        run: |
          NEW=$(git ls-files --others --exclude-standard -- 'review/approved_*_auto.csv' | head -1 || true)
          echo "path=$NEW" >> "$GITHUB_OUTPUT"
          echo "Auto-approved CSV this run: '${NEW:-none}'"

      - name: Commit state (shadow files always; watermark only on live runs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in state/predictions.jsonl state/shadow_results.jsonl state/shadow_state.json; do
            [ -f "$f" ] && git add "$f"
          done
          if [ "${{ needs.gate.outputs.dry_run }}" != "true" ]; then
            git add state/watermark.json
            # auto-approved conversion CSVs (review_gate: false) feed the Stage 2 dispatch
            { ls review/approved_*_auto.csv >/dev/null 2>&1 && git add review/approved_*_auto.csv; } || true
          fi
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update lead-automation state [skip ci]"
            git push
          fi

  # Phased go-live (2026-07-18): a live Stage-1 run that staged live-scope rows
  # (kununu score < 3, create_new — config `pipeline.live_scope`) converts them
  # immediately. The CSV was committed by the step above; stage2.yml checks out the
  # master HEAD, so it sees it. batch_size 3 = the live governor-limit ceiling.
  convert:
    needs: [gate, enrich]
    if: needs.gate.outputs.dry_run != 'true' && needs.enrich.outputs.auto_csv != ''
    concurrency:
      group: lead-automation-stage2   # same brake as a manual Stage-2 dispatch
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/stage2.yml
    with:
      dry_run: false
      batch_size: 3
      approved: ${{ needs.enrich.outputs.auto_csv }}
      config: ${{ inputs.config }}
    secrets: inherit
