# TEMPORARY diagnostic — why does `sf apex run --json` die with exit 1 and no output
# on ubuntu runners (Stage-2 runs 29115755874 / 29116262571) while queries work fine?
# Runs ONLY harmless `System.debug` anonymous Apex. Delete after the root cause is found.
name: DEBUG apex run (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SF_AUTOUPDATE_DISABLE: "true"
      SF_DISABLE_TELEMETRY: "true"
    steps:
      - name: Install Salesforce CLI (pinned 2.140.6, same as stage2)
        run: |
          node --version
          npm --version
          npm install --global @salesforce/cli@2.140.6
          sf --version

      - name: Authenticate to Salesforce
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          for attempt in 1 2 3; do
            printf '%s' "$SFDX_AUTH_URL" > auth.txt
            if sf org login sfdx-url --sfdx-url-file auth.txt --alias headless --set-default; then
              rm -f auth.txt; exit 0
            fi
            rm -f auth.txt; sleep 10
          done
          exit 1

      - name: Probe 1 — plain apex run --json (mimics SfClient env)
        run: |
          echo "System.debug('debug-apex probe 1');" > /tmp/probe.apex
          set +e
          FORCE_COLOR=0 NO_COLOR=1 sf apex run --file /tmp/probe.apex --target-org headless --json > out.json 2> err.txt
          echo "exit=$?"
          set -e
          echo "--- stdout ($(wc -c < out.json) bytes) ---"; cat out.json
          echo "--- stderr ($(wc -c < err.txt) bytes) ---"; cat err.txt

      - name: Probe 2 — apex run without --json
        run: |
          set +e
          sf apex run --file /tmp/probe.apex --target-org headless
          echo "exit=$?"
          set -e

      - name: Probe 3 — trace logging + sf CLI internal log
        run: |
          set +e
          SF_LOG_LEVEL=trace sf apex run --file /tmp/probe.apex --target-org headless --json
          echo "exit=$?"
          set -e
          echo "--- ~/.sf/sf.log tail ---"
          tail -n 120 ~/.sf/sf.log || echo "(no sf.log)"

      - name: Probe 4 — newer CLI 2.142.7
        run: |
          npm install --global @salesforce/cli@2.142.7
          sf --version
          set +e
          sf apex run --file /tmp/probe.apex --target-org headless --json
          echo "exit=$?"
          set -e
