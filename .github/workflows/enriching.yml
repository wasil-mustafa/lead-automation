name: Lead Automation — Enriching (paste-ready, no writes)

# Produce a dry-run QA workbook whose "Inspector Ready" sheet IS the write-back
# payload, so a human can apply this run's enrichment by hand: paste the sheet into
# Salesforce Inspector Reloaded's Data Import (object Lead, action Update, id field
# Id). One row per Lead the write-back would touch, in Salesforce field API names;
# rows whose payload is only the Id are dropped by `qa_artifact.build_workbook`.
#
# This workflow is DELIBERATELY read-only and NOT the pipeline:
#   * `--dry-run` is hardwired — there is no dry_run input to get wrong. Stage 1
#     writes nothing, the watermark is untouched (the code only advances it on a
#     live run) and no state or review CSV is committed, so this can never feed
#     Stage 2 or move the scheduled pipeline's resume point.
#   * no shadow-compare: it self-gates to ~once a day off a COMMITTED timestamp
#     (state/shadow_state.json) and costs ~7-9 Salesforce requests. Running it
#     here would spend that budget and, uncommitted, waste the gate for stage1.yml.
#   * `permissions: contents: read` — nothing to push.
# It still costs real Salesforce API calls and LeadFeeder credits (contact/company
# retrieves), which is why it is dispatch-only and shares stage1's concurrency group.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "LIMIT-scope the task scan (0 = unlimited)"
        type: number
        default: 0
      leadfeeder:
        description: "Use LeadFeeder enrichment (uncheck to skip credits)"
        type: boolean
        default: true
      config:
        description: "Alternate config.yaml path (blank = config/config.yaml)"
        type: string
        default: ""

# Same group as Stage 1, not a separate one: the LeadFeeder rate limit (100 req/min)
# and the credit quota are per API KEY, and the Salesforce API allocation is shared
# with other teams' integrations. A dry run writes nothing but still spends both, so
# it queues behind a scheduled enrich run instead of racing it.
concurrency:
  group: lead-automation-stage1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      # Quiet the sf CLI's background async work — a source of intermittent
      # "unsettled top-level await" / Node exit-13 hangs on CI runners.
      SF_AUTOUPDATE_DISABLE: "true"
      SF_DISABLE_TELEMETRY: "true"
      # The kununu feed is ~200 MB. Keep it OUT of the checkout (the old default
      # wrote it into the working tree); common.kununu_feed reads KUNUNU_CACHE at
      # call time and sniffs CSV vs JSONL from the file content.
      KUNUNU_CACHE: ${{ runner.temp }}/kununu/profiles.csv
      # Whether the optional Main-Profile-Account checkout below can run. A
      # boolean, not the token: this only gates a step, so the PAT itself never
      # enters the environment.
      HAS_MPA: ${{ secrets.MPA_PAT != '' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check out Main-Profile-Account (optional — owns the kununu feed reader)
        # `leadauto.kununu_feed` bridges to `common.kununu_feed` in the sibling repo;
        # this project deliberately keeps NO local copy. Without the checkout the
        # bridge raises MpaBridgeError, which is caught and degrades to no alt names,
        # no profile_score and no kununu industry (the Industry column then falls back
        # to LeadFeeder). That is the same state CI has always run in — so the step is
        # skipped, not failed, when no PAT for the private repo is configured.
        id: mpa
        # NEVER fail the run on this: a wrong, expired or revoked PAT must
        # degrade to the no-feed state (which is how CI ran until 2026-08-19),
        # not break the scheduled pipeline. Without this a present-but-invalid
        # MPA_PAT is WORSE than an absent one - an absent secret skips the step,
        # while a bad one flips HAS_MPA true and hard-fails the checkout.
        continue-on-error: true
        if: env.HAS_MPA == 'true'
        uses: actions/checkout@v4
        with:
          repository: Nicolaus-Pichorner/Main-Profile-Account
          token: ${{ secrets.MPA_PAT }}
          path: mpa
          sparse-checkout: common
          sparse-checkout-cone-mode: true

      - name: Point the bridge at that checkout
        if: steps.mpa.outcome == 'success'
        run: echo "MPA_ROOT=${{ github.workspace }}/mpa" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Salesforce CLI
        run: |
          # Pinned for reproducibility; bump deliberately after a dry-run check.
          npm install --global @salesforce/cli@2.140.6
          sf --version

      - name: Compute feed cache key
        id: feedkey
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache kununu profile feed
        # Daily key: first run of the day restores yesterday's feed (stale), then
        # the staleness policy refreshes it and the post-job save stores today's.
        # If the download fails, the stale restore keeps alt names/scores working.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kununu
          key: kununu-feed-csv-${{ steps.feedkey.outputs.date }}
          restore-keys: kununu-feed-csv-

      - name: Authenticate to Salesforce
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}   # secret -> env, never inlined
        run: |
          # The sf CLI intermittently hangs on login (Node exit 13 / "unsettled
          # top-level await"), so retry a few times before failing the job.
          for attempt in 1 2 3; do
            printf '%s' "$SFDX_AUTH_URL" > auth.txt
            if sf org login sfdx-url --sfdx-url-file auth.txt --alias headless --set-default; then
              rm -f auth.txt
              echo "Authenticated on attempt $attempt."
              exit 0
            fi
            rm -f auth.txt
            echo "Auth attempt $attempt failed; retrying in 10s..." >&2
            sleep 10
          done
          echo "Salesforce authentication failed after 3 attempts." >&2
          exit 1

      - name: Run Stage 1 (dry — enrichment only)
        env:
          PYTHONPATH: src
          LEADFEEDER_API_KEY: ${{ secrets.LEADFEEDER_API_KEY }}
          # HTTP Basic, password-only (KUNUNU_API_USER stays unset). NOT
          # KUNUNU_API_TOKEN: the feed does not speak Bearer and common.kununu_feed
          # refuses to read that name — the GitHub secret is mapped here on the way in.
          KUNUNU_API_PASSWORD: ${{ secrets.KUNUNU_API_TOKEN }}
        run: |
          FLAGS="--dry-run"
          if [ "${{ inputs.leadfeeder }}" = "false" ]; then FLAGS="$FLAGS --no-leadfeeder"; fi
          LIMIT="${{ inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" -gt 0 ] 2>/dev/null; then FLAGS="$FLAGS --limit $LIMIT"; fi
          if [ -n "${{ inputs.config }}" ]; then FLAGS="$FLAGS --config ${{ inputs.config }}"; fi
          echo "Running: python -m leadauto stage1 $FLAGS"
          python -m leadauto stage1 $FLAGS --qa-path enriching.xlsx

      - name: Upload the paste-ready workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-automation-enriching-${{ github.run_id }}
          path: enriching.xlsx
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm nothing was staged for Stage 2
        # Belt and braces: a dry run must not leave an auto-approved CSV behind, which
        # is what stage1.yml's detect step hands to the conversion workflow. Nothing
        # is committed here, so this only ever catches a code regression.
        if: always()
        run: |
          LEFTOVER=$(git ls-files --others --exclude-standard -- 'review/approved_*_auto.csv' | head -1 || true)
          if [ -n "$LEFTOVER" ]; then
            echo "Dry run produced '$LEFTOVER' — a dry run must stage nothing." >&2
            exit 1
          fi
          echo "No approval CSV staged, as expected."
