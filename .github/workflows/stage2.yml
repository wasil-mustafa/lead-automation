name: Lead Automation — Stage 2 (convert, gated)

# Convert the approved Leads: either a human-committed review/approved_<date>.csv or,
# with config `pipeline.review_gate: false`, the approved_<ts>_auto.csv a live Stage-1
# run committed (link/create_new rows pre-approved). The conversion Apex re-filters
# IsConverted=false, so re-running is a no-op.
#
# THE GATE: this workflow is dispatch-only and `dry_run` defaults to true — a live
# conversion happens only when a human deliberately dispatches with dry_run unchecked.
# (A GitHub Environment with required reviewers was the original plan, but that
# protection rule needs a paid plan on private repos — verified 2026-07-10.)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no conversions)"
        type: boolean
        default: true
      batch_size:
        description: "Leads converted per Apex run (small: each conversion cascades triggers/flows/rules in one tx)"
        type: number
        default: 10
      approved:
        description: "Approved CSV path (blank = newest review/approved_*.csv)"
        type: string
        default: ""

concurrency:
  group: lead-automation-stage2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    env:
      # Quiet the sf CLI's background async work — a source of intermittent
      # "unsettled top-level await" / Node exit-13 hangs on CI runners.
      SF_AUTOUPDATE_DISABLE: "true"
      SF_DISABLE_TELEMETRY: "true"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Salesforce CLI
        run: |
          # Pinned for reproducibility; bump deliberately after a dry-run check.
          npm install --global @salesforce/cli@2.140.6
          sf --version

      - name: Authenticate to Salesforce
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          # The sf CLI intermittently hangs on login (Node exit 13 / "unsettled
          # top-level await"), so retry a few times before failing the job.
          for attempt in 1 2 3; do
            printf '%s' "$SFDX_AUTH_URL" > auth.txt
            if sf org login sfdx-url --sfdx-url-file auth.txt --alias headless --set-default; then
              rm -f auth.txt
              echo "Authenticated on attempt $attempt."
              exit 0
            fi
            rm -f auth.txt
            echo "Auth attempt $attempt failed; retrying in 10s..." >&2
            sleep 10
          done
          echo "Salesforce authentication failed after 3 attempts." >&2
          exit 1

      - name: Run Stage 2
        env:
          PYTHONPATH: src
        # Explicit bash => GitHub adds -o pipefail; without it the `| tee` pipe would
        # swallow a failing stage2 exit code and report the job green.
        shell: bash
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; else FLAGS="--no-dry-run"; fi
          if [ -n "${{ inputs.batch_size }}" ]; then FLAGS="$FLAGS --batch-size ${{ inputs.batch_size }}"; fi
          if [ -n "${{ inputs.approved }}" ]; then FLAGS="$FLAGS --approved ${{ inputs.approved }}"; fi
          echo "Running: python -m leadauto stage2 $FLAGS"
          python -m leadauto stage2 $FLAGS | tee stage2_log.txt

      - name: Upload conversion log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-automation-stage2-log-${{ github.run_id }}
          path: |
            stage2_log.txt
            preflight_failures.csv
          if-no-files-found: warn
