name: Lead Automation — pipeline

# One run: extract new Leads -> enrich (LeadFeeder) -> match vs existing
# Accounts/Contacts -> write enrichment back to KN_* fields -> tag the LF-outcome
# campaign -> CONVERT every lead in an auto-convert campaign bucket ("EnrichLeadfedup":
# this run's leads plus the sweep of earlier runs' unconverted members) -> upload the QA
# artifact. The watermark is advanced and committed back to the repo so the next run
# resumes where this one stopped. Since 2026-11-01 (Wasil) there is no separate Stage 2
# and no review/approved CSV: conversion happens in this process (see pipeline/run.py).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Salesforce writes, no conversions)"
        type: boolean
        default: true
      limit:
        description: "LIMIT-scope the task scan (0 = unlimited)"
        type: number
        default: 0
      leadfeeder:
        description: "Use LeadFeeder enrichment (uncheck to skip credits)"
        type: boolean
        default: true
      config:
        description: "Alternate config.yaml path (blank = config/config.yaml)"
        type: string
        default: ""
  # Scheduling is EXTERNAL: cron-job.org job 8029899 hits this workflow's
  # workflow_dispatch every 2 h at :48, 08:48-16:48 Vienna, Mon-Fri (GitHub's own cron
  # delivered these runs hours late and dropped most firings). Since 2026-10-19 that job
  # POSTs {"ref":"master","inputs":{"dry_run":"false"}}, so scheduled runs are LIVE.

# Never let two runs overlap (they share the watermark file and the conversion sweep).
concurrency:
  group: lead-automation-pipeline
  cancel-in-progress: false

permissions:
  contents: write   # commit the advanced watermark + shadow state

jobs:
  gate:
    # Decides the effective dry-run mode. Runs are triggered by workflow_dispatch
    # (external cron-job.org schedule or a manual run), so the flag comes from
    # `inputs.dry_run`, which defaults to true for a MANUAL dispatch. The scheduler
    # sends dry_run=false explicitly. The `if schedule` branch below is a harmless
    # guard if a GitHub cron is ever re-added.
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.decide.outputs.dry_run }}
    steps:
      - name: Decide dry-run mode
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY="true"   # a GitHub cron, if ever re-added, stays dry
          else
            DRY="${{ inputs.dry_run }}"
          fi
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"

  run:
    needs: gate
    runs-on: ubuntu-latest
    env:
      # Quiet the sf CLI's background async work — a source of intermittent
      # "unsettled top-level await" / Node exit-13 hangs on CI runners.
      SF_AUTOUPDATE_DISABLE: "true"
      SF_DISABLE_TELEMETRY: "true"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Salesforce CLI
        run: |
          # Pinned for reproducibility; bump deliberately after a dry-run check.
          npm install --global @salesforce/cli@2.140.6
          sf --version

      - name: Compute feed cache key
        id: feedkey
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache kununu profile feed
        # Daily key: first run of the day restores yesterday's feed (stale), then
        # ensure_feed refreshes it and the post-job save stores it under today's key.
        # If the download fails, the stale restore keeps the gate working.
        uses: actions/cache@v4
        with:
          # The runner-temp dir named by KUNUNU_CACHE below, NOT the checkout: the feed
          # is ~200 MB, and the old `kununu_profiles.jsonl` here named a path nothing has
          # written since kununu moved the feed to CSV on 2026-08-06.
          path: ${{ runner.temp }}/kununu
          key: kununu-feed-csv-${{ steps.feedkey.outputs.date }}
          restore-keys: kununu-feed-csv-

      - name: Authenticate to Salesforce
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}   # secret -> env, never inlined
        run: |
          # The sf CLI intermittently hangs on login (Node exit 13 / "unsettled
          # top-level await"), so retry a few times before failing the job.
          for attempt in 1 2 3; do
            printf '%s' "$SFDX_AUTH_URL" > auth.txt
            if sf org login sfdx-url --sfdx-url-file auth.txt --alias headless --set-default; then
              rm -f auth.txt
              echo "Authenticated on attempt $attempt."
              exit 0
            fi
            rm -f auth.txt
            echo "Auth attempt $attempt failed; retrying in 10s..." >&2
            sleep 10
          done
          echo "Salesforce authentication failed after 3 attempts." >&2
          exit 1

      - name: Shadow compare (score past dry-run predictions)
        continue-on-error: true   # a compare hiccup must not block the run
        env:
          PYTHONPATH: src
        # Self-gating to ~once a day (state/shadow_state.json, committed below): a compare
        # costs ~7-9 Salesforce requests and scores HUMAN conversions, which resolve over
        # days — running it on all daily dispatches re-read the same predictions.
        # The workbook is written on EVERY run regardless: a gated-off run produces it
        # from committed state with Summary `compare_ran=no` (zero org calls), so the
        # artifact below is only ever missing when this step actually failed.
        run: python -m leadauto shadow-compare

      - name: Upload shadow comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-automation-shadow-${{ github.run_id }}
          path: shadow_comparison.xlsx
          if-no-files-found: ignore

      - name: Run the pipeline
        id: pipeline
        env:
          PYTHONPATH: src
          LEADFEEDER_API_KEY: ${{ secrets.LEADFEEDER_API_KEY }}
          # The feed is HTTP Basic, password-only (KUNUNU_API_USER stays unset).
          # Deliberately NOT KUNUNU_API_TOKEN: `common.kununu_feed` refuses that name
          # because the feed does not speak Bearer, so passing it authenticated nothing.
          # The GitHub secret is *called* KUNUNU_API_TOKEN and holds the password.
          KUNUNU_API_PASSWORD: ${{ secrets.KUNUNU_API_TOKEN }}
          # Keep the ~200 MB feed out of the checkout. Set at STEP level because the
          # `runner` context does not exist in a job-level `env:` block — putting it
          # there is an invalid workflow file, which startup-failed every run in this
          # repo on 2026-08-19 until it was reverted.
          KUNUNU_CACHE: ${{ runner.temp }}/kununu/profiles.csv
        run: |
          FLAGS=""
          if [ "${{ needs.gate.outputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; else FLAGS="--no-dry-run"; fi
          if [ "${{ inputs.leadfeeder }}" = "false" ]; then FLAGS="$FLAGS --no-leadfeeder"; fi
          LIMIT="${{ inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" -gt 0 ] 2>/dev/null; then FLAGS="$FLAGS --limit $LIMIT"; fi
          if [ -n "${{ inputs.config }}" ]; then FLAGS="$FLAGS --config ${{ inputs.config }}"; fi
          echo "Running: python -m leadauto run $FLAGS"
          python -m leadauto run $FLAGS --qa-path qa_artifact.xlsx

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-automation-qa-${{ github.run_id }}
          path: qa_artifact.xlsx
          if-no-files-found: warn

      - name: Commit state (shadow files always; watermark only on live runs)
        # always(): the run step exits non-zero on a failed conversion AFTER it wrote the
        # watermark and predictions to disk — skipping this step would drop them, and
        # the next run would re-read the same tasks and re-spend LeadFeeder credits.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in state/predictions.jsonl state/shadow_results.jsonl state/shadow_state.json state/convert_holdouts.jsonl; do
            [ -f "$f" ] && git add "$f"
          done
          if [ "${{ needs.gate.outputs.dry_run }}" != "true" ]; then
            git add state/watermark.json
          fi
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update lead-automation state [skip ci]"
            git push
          fi
