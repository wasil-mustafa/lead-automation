# Lead Automation — non-secret configuration.
# Secrets (SF_AUTH_URL, LEADFEEDER_API_KEY) come from env / GitHub Secrets, never here.

salesforce:
  org_alias: headless
  api_version: "66.0"
  # Pinned converted LeadStatus: trusted as-is, no per-run LeadStatus SOQL.
  # Leave blank to fall back to querying the org's first converted status.
  converted_status: Qualified
  # Owner to assign converted leads to. Live scope is currently the no-sales-potential
  # population (kununu score < 3, create_new) — converted Lead, new Account and new
  # Contact all go to the 'Rohdaten Pool' user (Wasil, 2026-07-18). Revisit when the
  # live scope widens beyond pool-quality leads (Wasil's user id: 005Mz00000XvtQzIAJ).
  owner_id: "005Mz00000Xw0jjIAB"
  # 'Rohdaten Pool' user: linked Accounts owned by this user are raw data and get
  # overwrite-enriched at conversion time (Owner.Name = 'Rohdaten Pool').
  rohdaten_pool_owner_id: "005Mz00000Xw0jjIAB"

leadfeeder:
  base_url: "https://api.leadfeeder.com/v1"
  company_list_name: "Lead_Automation"
  contact_list_name: "Lead_Automation"
  max_requests_per_min: 95   # stay under LeadFeeder's 100/min/account hard limit
  max_retries: 4             # retries on 429/5xx before surfacing HTTPError
  retrieve_batch: 100        # GET /companies & /contacts (API max 100)
  match_batch: 200           # POST /companies/match (API max 200)
  # Second-chance match: `max_results_per_company` for the leads the primary pass (which
  # always asks for 3) left UNMATCHED. 0 disables the pass, 20 is the API ceiling. It can
  # only add candidates for the calibrated gate to judge, and only for leads that matched
  # nothing — a working match is never re-asked. See leadfeeder/enrich.py.
  # MEASURED 0 (2026-08-25): the backtest replayed all 103 historical `no_lf_match` leads
  # and recovered NONE of them (78 still unmatched, 25 now match at width 3 anyway). Set
  # to 20 to re-enable — the code and `wide-match-backtest` stay, the mechanism is real in
  # Contact Presence Check's data, it just does not bite on this population.
  match_wide_results: 0
  # Run the contact cascade (search, 1-credit retrieve, find-contact-data) ONLY for
  # leads whose Lead record still lacks an email or a phone — the fields it feeds
  # (both fill-only-blank in writeback.py). false = look up every matched lead, which
  # also yields Title/LinkedIn/FirstName. The ZPE event config sets it true
  # (Wasil, 2026-09-18: 116/116 leads had an email, 109/116 a phone).
  contact_lookup_only_when_needed: false
  # 'Find contact details' (async external-provider lookup) for found contacts that
  # have no direct-dial number. 1 credit per contact that actually gains data.
  find_contact_data: true
  find_details_timeout: 180  # seconds to wait for the async job before degrading
  find_details_poll: 10      # job-status poll interval (seconds)

# kununu DWH profile feed: resolves a lead's profile to its assigned-company names
# (which widen the LF name-agreement gate's evidence) and its profile_score (the
# live-scope gate's input, so no feed => nothing converts). Harmless without
# credentials (KUNUNU_API_PASSWORD) — the gate then behaves exactly as before.
#
# The ENDPOINT, the CACHE PATH and the PARSER come from `common.kununu_feed` in the
# Main-Profile-Account repo (see src/leadauto/mpa_bridge.py). `url` and `cache_path`
# are intentionally absent: both used to be hardcoded here to `profiles.jsonl`, which
# has 404'd since kununu switched the feed to CSV on 2026-08-06, and cache_path put a
# ~200 MB file inside the OneDrive-synced checkout. Override with the KUNUNU_FEED_URL
# and KUNUNU_CACHE env vars, which `common` reads at call time.
kununu_feed:
  enabled: true
  max_age_hours: 24                   # daily freshness (confirmed requirement)

# Task Subjects the pipeline processes, mapped to their parser key.
# Simplified scope (2026-07-02): ONLY Claimed Profile + EBP Trial. Subjects not listed
# here are left for humans (e.g. Kontaktanfrage) or ignored (Ecom, event/content types).
task_types:
  "Inbound Sales Task: New Claimed Profile": claimer
  "Inbound Sales Task: EBP Trial": ebp_trial
  # Badge-scan event tasks (parser added 2026-09-18 for ZPE 2026). Mapped here so the
  # subject is known, but NOT in enabled_task_types: an event Task carries no kununu
  # URL, so the scheduled run cannot process it — a one-off config with the profile
  # link pre-set on the Lead does (config.zpe-2026-09.yaml).
  "Inbound Sales Task: Eventteilnahme": event

# Which parser keys are currently enabled.
enabled_task_types:
  - claimer
  - ebp_trial

# Only Tasks in these statuses are 'fresh' (unhandled) and get processed — a closed/handled
# touchpoint was already worked by a human. Explicit allowlist, NOT `IsClosed = false`: the
# org picklist is bilingual/legacy and flags 'Abgeschlossen' (Completed) as not-closed, so
# it is deliberately EXCLUDED here. Empty list => no status filter (process any status).
fresh_task_statuses:
  - "In Progress"
  - "in Arbeit"
  - "Not Started"

# Own-company email domains. A lead whose Lead.Email OR parsed contact email sits on one
# of these is an internal colleague (profile-claim / trial test), not a sales lead — it is
# excluded from Stage 1 extraction and from shadow scoring. Bare domain roots, matched on
# the domain's second-level label, so any TLD counts (kununu.com/.at, xing.com, onlyfy.io).
excluded_email_domains:
  - kununu
  - xing
  - onlyfy

matching:
  lf_min_match_score: 0.70   # LeadFeeder company-match floor
  # Name-agreement gate (calibrated on the 6-month control set, 2026-07-02): LF's score
  # alone is untrustworthy — 0.9+ on wrong companies, <0.2 on exact-name hits.
  lf_name_agree_min: 85      # required agreement (0-100) when score >= lf_min_match_score
  lf_name_agree_rescue: 90   # agreement that accepts a candidate regardless of score
  dedupe_name_agree_min: 85  # rule-4 floor: account name vs LF/profile/assigned-company names

pipeline:
  # false => live Stage-1 runs emit review/approved_<ts>_auto.csv with every
  # live-scope row pre-approved (see live_scope below; skip/review never; write-back
  # failures held back), so Stage 2 converts without a human filling Approve?
  # (Wasil 2026-07-10; narrowed to the live scope 2026-07-18).
  review_gate: false         # off since go-live 2026-07-18: live runs auto-approve live-scope rows
  dry_run: true              # true => no SF writes/conversions (kept ON while validating vs control file)
  batch_limit: 0             # 0 = unlimited; >0 = LIMIT-scoped
  # 14 days (was 90 for the initial backlog sweep, which is done): the window only has to
  # cover the gap between runs plus a safety margin, and every extra day re-reads tasks
  # processed_task_ids already dedupes — 646 rows/run at 90 days, and past 2000 rows the
  # scan starts paying extra queryMore calls (API-call reduction 2026-07-25).
  task_lookback_days: 14
  # Lead.Status allowlist, applied post-query (no extra API call). Empty = no filter.
  # [New] since 2026-09-28 (Wasil): a lead in any other status has already been worked
  # by a human (that is also what makes the already-enriched skip below unnecessary).
  # Consequence: "No Demand" and other human-touched leads drop out of scope entirely,
  # including shadow predictions.
  lead_statuses:
    - New
  # true = no already-enriched skip (Wasil, 2026-09-28): lead_statuses [New] already
  # keeps human-worked leads out, so the kununu marker (KN_KununuLinkProfile__c /
  # KN_KununuProfileName__c) no longer gates anything. One pass per Task still holds
  # (processed_task_ids).
  include_enriched_leads: true
  # true lets the write-back OVERWRITE a Lead.Phone of the form +0<digits> (a national
  # number with '+' glued onto the trunk zero — passes the org's validation, dials
  # nowhere) with +49/+43/+41 + the rest, by the lead's country. Default false: Phone
  # is strictly fill-only-blank here. The one-off ZPE 2026 config sets it (46 of 109
  # badge-scan phones had that shape, Wasil 2026-09-18).
  repair_national_phone: false
  # LeadFeeder-outcome campaign tagging (Wasil, 2026-10-19). On a NON-dry run a lead
  # of a task type below becomes a CampaignMember of exactly one of these: no accepted
  # LF match -> unmatched; WRITTEN BACK this run with KN_Employee__c and Street both
  # filled afterwards -> matched_complete; written back with either blank ->
  # matched_incomplete. An LF-matched lead that was not written back (out of the
  # write-back scope, or a failed write-back) gets no campaign. Leads already in any of
  # them are excluded from every later run (dry or live) by an anti-join on the lead
  # read. Absent/empty = off. Never tags with LeadFeeder disabled.
  lf_campaigns:
    matched_complete: 701Mz00001aPCDdIAO     # EnrichLeadfedup
    matched_incomplete: 701Mz00001aP9hDIAS   # EnrichLeadshortage
    unmatched: 701Mz00001aKIjZIAW            # EnrichLeadmanually
  # Task types (parser keys) that are tagged; absent = every enabled type.
  # claimer = "Inbound Sales Task: New Claimed Profile" (Wasil, 2026-10-19).
  lf_campaign_task_types:
    - claimer
  # Phased go-live gate (Wasil, 2026-07-18): on a non-dry run ONLY leads matching this
  # scope are written back + staged for conversion; every other lead is left untouched
  # (humans keep working it) and gets a shadow prediction instead. A missing kununu
  # score (profile not in feed / no reviews) fails the gate only while a cap is set.
  live_scope:
    # null = no score axis (Wasil, 2026-09-28): every create_new lead goes live whatever
    # its kununu score, and a missing score no longer fails closed. Was 3.0 (strict <,
    # the human "No Demand" line) from the 2026-07-18 go-live.
    max_kununu_score: null
    # CONVERSION scope: decisions a live run stages for Stage 2. Empty since 2026-10-19
    # (Wasil): live runs enrich only — nothing is auto-converted, no Stage 2 chain;
    # humans keep converting. Was [create_new] from the 2026-07-18 go-live. Never
    # list skip/review here.
    decisions: []
    # WRITE-BACK scope (2026-10-19, Wasil): every LF-matched decision gets the live
    # Lead write-back — the account decision only matters for conversion. Never skip
    # (no accepted LF match). Absent = same as `decisions`.
    writeback_decisions:
      - create_new
      - link
      - review
    # Task types a live run may write back; an enabled type not listed stays dry
    # (shadow prediction only). Absent = every enabled type. 2026-10-19 (Wasil):
    # claimer live, ebp_trial still dry. 2026-10-20 (Wasil): ebp_trial enriched live too.
    task_types:
      - claimer
      - ebp_trial
    # true admits second-chance ("wide") LF matches to live write-back + conversion.
    # Default false: they are predicted and shadow-scored but never written, until the
    # pass's accuracy is measured here. See live_scope.py.
    # true since 2026-09-28 (Wasil): wide matches go live too, but are flagged —
    # QA live_scope = yes_wide_match + Summary live_scope_wide_match. Moot while
    # leadfeeder.match_wide_results is 0 (the pass never runs).
    allow_wide_match: true
