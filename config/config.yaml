# Lead Automation — non-secret configuration.
# Secrets (SF_AUTH_URL, LEADFEEDER_API_KEY) come from env / GitHub Secrets, never here.

salesforce:
  org_alias: headless
  api_version: "66.0"
  converted_status: Qualified
  # Owner to assign converted leads to. Reconcile with the real integration user.
  owner_id: "005Mz00000XvtQzIAJ"
  # Optional campaign tagging (currently inactive in the org; leave null to skip).
  campaign_id: null

leadfeeder:
  base_url: "https://api.leadfeeder.com/v1"
  company_list_name: "Lead_Automation"
  contact_list_name: "Lead_Automation"
  max_requests_per_min: 95   # stay under LeadFeeder's 100/min/account hard limit
  max_retries: 4             # retries on 429/5xx before surfacing HTTPError
  retrieve_batch: 100        # GET /companies & /contacts (API max 100)
  match_batch: 200           # POST /companies/match (API max 200)

# Task Subjects the pipeline processes, mapped to their parser key.
# Simplified scope (2026-07-02): ONLY Claimed Profile + EBP Trial. Subjects not listed
# here are left for humans (e.g. Kontaktanfrage) or ignored (Ecom, event/content types).
task_types:
  "Inbound Sales Task: New Claimed Profile": claimer
  "Inbound Sales Task: EBP Trial": ebp_trial

# Which parser keys are currently enabled.
enabled_task_types:
  - claimer
  - ebp_trial

matching:
  lf_min_match_score: 0.70   # LeadFeeder company-match floor
  # Name-agreement gate (calibrated on the 6-month control set, 2026-07-02): LF's score
  # alone is untrustworthy — 0.9+ on wrong companies, <0.2 on exact-name hits.
  lf_name_agree_min: 85      # required agreement (0-100) when score >= lf_min_match_score
  lf_name_agree_rescue: 90   # agreement that accepts a candidate regardless of score
  auto_link_threshold: 0.90  # >= : link to existing Account/Contact
  review_threshold: 0.60     # [review, auto_link): flag for review; < review: create new

pipeline:
  review_gate: true          # master toggle; false => auto-convert
  dry_run: true              # true => no SF writes/conversions (kept ON while validating vs control file)
  batch_limit: 0             # 0 = unlimited; >0 = LIMIT-scoped
  task_lookback_days: 35     # overlap window around the watermark
